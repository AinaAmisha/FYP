<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}
        Email Security Control Center
        {% endblock %}
    </title>

    <link rel="stylesheet"
          href="{{ url_for('static',
          filename='css/style.css') }}">

</head>


<body>

<div class="sidebar">

    <div class="brand">

        <div class="brand-icon">
            ES
        </div>

        <div>
            <h2>Email Security</h2>
            <span>Control Center</span>
        </div>

    </div>


    <nav>

        <nav>

    <a href="{{ url_for('dashboard') }}"
       class="{% if request.endpoint == 'dashboard' %}active{% endif %}">
        Dashboard
    </a>

    <a href="{{ url_for('message_analysis') }}"
        class="{% if request.endpoint == 'message_analysis' %}active{% endif %}">
        Message Analysis
    </a>

    <a href="{{ url_for('audit_logs') }}"
         class="{% if request.endpoint in ['audit_logs', 'message_detail'] %}active{% endif %}">
         Message Audit Logs
    </a>

    <a href="{{ url_for('false_detection') }}"
        class="{% if request.endpoint == 'false_detection' %}active{% endif %}">
        False Detection
    </a>

    <a href="{{ url_for('review_center') }}"
        class="{% if request.endpoint in ['review_center', 'review_message'] %}active{% endif %}">
        Review Center
    </a>

    <a href="{{ url_for('quarantine') }}"
        class="{% if request.endpoint == 'quarantine' %}active{% endif %}">
        Quarantine
    </a>

    <a href="{{ url_for('model_performance') }}"
        class="{% if request.endpoint == 'model_performance' %}active{% endif %}">
        Model Performance
    </a>

    <a href="#">
        Reports
    </a>

</nav>

    </nav>


    <div class="sidebar-footer">

        <span class="status-dot"></span>

        System Online

    </div>

</div>


<main class="main-content">

    {% block content %}
    {% endblock %}

</main>

</body>

</html>
